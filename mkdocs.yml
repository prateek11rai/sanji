# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json

# Site Information
site_name: Sanji
site_url: https://prateek11rai.github.io/sanji/
site_author: Prateek Rai
# Names no topics on purpose — a subject list dates the moment something new
# goes up, and descriptions are not a ranking signal.
site_description: Prateek Rai. Mostly whatever I've just built, broken, or read.
copyright: >-
  Copyright &copy; 2025 Prateek Rai

# Repository Information
repo_name: sanji
repo_url: https://github.com/prateek11rai/sanji

# Theme Configuration (Material)
theme:
  name: material
  language: en
  custom_dir: overrides
  font:
    text: JetBrains Mono
    code: JetBrains Mono
  favicon: logos/strawhat.png
  icon:
    logo: logos/strawhat
  features:
    - announce.dismiss
    # - content.action.edit
    # - content.action.view
    - content.code.annotate
    - content.code.copy
    # - content.code.select
    # - content.footnote.tooltips
    - content.tabs.link
    - content.tooltips
    # - header.autohide
    # - navigation.expand
    # - navigation.footer
    - navigation.indexes
    # - navigation.instant
    # - navigation.instant.prefetch
    # - navigation.instant.progress
    # - navigation.prune
    # - navigation.sections
    - navigation.tabs
    # - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
    # - toc.integrate
  # A mapping, not a list: header.html gates the scheme toggle *and* its
  # JavaScript on `palette is mapping`, so this form drops both.
  palette:
    scheme: dracula-dark

# Documentation Configuration
docs_dir: docs

# Originals live beside their crops so they can be redone, but they are 5 MB
# each and nothing links to them.
exclude_docs: |
  assets/images/home/backdrop-source*
  assets/images/home/backdrop-social.png

# Nav Configuration
nav:
  - Me: index.md
  - Projects:
      - Projects: projects/index.md
      - DocAid:
        - DocAid: projects/doc-aid/index.md
  - Blog:
    - blog/index.md
  - Résumé: resume.md

# Attributes addition
markdown_extensions: 
  - attr_list
  - md_in_html
  - pymdownx.blocks.caption
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        custom_icons:
          - overrides/.icons
  - footnotes
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# Extra CSS
extra_css:
  - extra/css/dracula.css
  - extra/css/cards.css

# Extra Configuration
extra:
  # Feeds the schema.org JSON-LD on the homepage and résumé. `sameAs` comes
  # from `social` below, so profiles are listed once.
  person:
    name: Prateek Rai
    jobTitle: Senior Software Engineer I
    worksFor:
      name: Atlan
      url: https://atlan.com
    alumniOf:
      name: Thapar Institute of Engineering and Technology
      url: https://www.thapar.edu

  home:
    # Fetched from GitHub, never committed. Renders at ~240px, so 480 covers 2x.
    avatar: https://github.com/prateek11rai.png?size=480

    # Generated by `uv run poe backdrop <image>`. `narrow` is a separate
    # portrait crop, not a scaled copy. Unset it and the hero paints its own sky.
    backdrop:
      wide: assets/images/home/backdrop-wide.avif
      wide_fallback: assets/images/home/backdrop-wide.webp
      narrow: assets/images/home/backdrop-narrow.avif
      narrow_fallback: assets/images/home/backdrop-narrow.webp
      position: 50% 42%
      # Measured: at 40% the brightest patch under the card still gives body
      # copy 7.5:1. Raise it for a brighter image.
      dim: 40%
  consent:
    title: Cookie Consent
    description: >-
      This site uses Google Analytics to understand how it's used.
      No personal data is collected. You can accept or decline below.
    cookies:
      analytics: Google Analytics
  analytics:
    provider: google
    property: __GA4_PLACEHOLDER__
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/emoticon-happy-outline
          name: This page was helpful
          data: 1
          note: >-
            Thanks for your feedback!
        - icon: material/emoticon-sad-outline
          name: This page could be improved
          data: 0
          note: >-
            Thanks for your feedback!
  # generator: false (https://squidfunk.github.io/mkdocs-material/setup/setting-up-the-footer/#generator-notice)
  social:
    - icon: fontawesome/solid/envelope
      link: mailto:prateek11rai@protonmail.com
      name: Email
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/prateek11rai/
      name: LinkedIn
    - icon: fontawesome/brands/github
      link: https://github.com/prateek11rai
      name: GitHub
    - icon: fontawesome/brands/goodreads-g
      link: https://www.goodreads.com/user/show/186922946-prateek-rai
      name: GoodReads
    - icon: fontawesome/brands/strava
      link: https://www.strava.com/athletes/prateek11rai
      name: Strava
    - icon: logos/myanimelist
      link: https://myanimelist.net/animelist/prateek11rai
      name: MyAnimeList
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/@prateek11rai
      name: YouTube
    - icon: fontawesome/brands/instagram
      link: https://instagram.com/prateek11rai
      name: Instagram
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/prateek11rai
      name: X
    - icon: fontawesome/brands/facebook
      link: https://www.facebook.com/prateek11rai
      name: Facebook

# Build hooks
hooks:
  - scripts/llms_txt.py
  - scripts/json_ld.py

# Plugins
plugins:
  - meta:
      enabled: true
  - search:
      enabled: true
  - social:
      enabled: true
      cards_layout_options:
        # background_color must stay transparent: the plugin composites it
        # *over* the image, so an opaque value hides the photo entirely.
        background_image: docs/assets/images/home/backdrop-social.png
        background_color: transparent
        color: "#f8f8f2"
        font_family: JetBrains Mono
  - blog:
      authors: true
      draft_on_serve: true
      draft: true

  -  rss:
      enabled: true
      match_path: blog/posts/.* 
      date_from_meta:
        as_creation: date
      categories:
        - categories
