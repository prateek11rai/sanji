[project]
name = "sanji"
# Inert. This is a website, not a distributable package — nothing consumes this
# number, so it never moves.
version = "1.0.0"
description = "Repository to maintain a personal gitHub page deployment using mkdocs."
authors = [{ name = "prateek11rai", email = "prateek11rai@protonmail.com" }]
requires-python = "==3.12.2"
readme = "README.md"
license = { file = "LICENSE" }
dependencies = [
    "mkdocs>=1.6.1,<2",
    "mkdocs-material[imaging]>=9.6.14,<10",
    "mkdocs-rss-plugin>=1.17.7",
    "poethepoet>=0.34",
    "python-dotenv>=1.1,<2",
    "requests>=2.32,<3",
]

[tool.poe.tasks]
serve = { cmd = "uv run mkdocs serve", env = { DYLD_LIBRARY_PATH = "/opt/homebrew/lib" } }
build = { cmd = "uv run mkdocs build", env = { DYLD_LIBRARY_PATH = "/opt/homebrew/lib" } }
backdrop = { cmd = "uv run python scripts/backdrop.py", help = "Crop and encode a homepage backdrop from one high-res image" }

# No build backend: there is no `sanji` package to build. Without this, uv
# builds and reinstalls an empty wheel on every dependency change.
[tool.uv]
package = false

# The machine-level uv config points at a private index. This project is public
# and anyone cloning it resolves from PyPI.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

